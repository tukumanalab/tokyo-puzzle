name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install numpy Pillow scipy

      - name: Cache generated data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: public/data
          key: data-${{ hashFiles('scripts/fetch-boundaries.ts', 'scripts/gen_stl.py', 'scripts/gen_frame.py') }}

      - name: Fetch boundary data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: npm run data:fetch

      - name: Generate STL files
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          npm run data:stl
          npm run data:frame

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
